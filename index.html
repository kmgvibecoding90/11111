<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Книжная гостиная — скорочтение и тренировка мозга</title>
  <meta name="description" content="Курс скорочтения, тренажёры для внимания и памяти: таблица Шульте, тест скорости чтения, ребусы, карточки, логика, нейрогимнастика и Струп-тест.">
  <meta property="og:title" content="Книжная гостиная — скорочтение и тренировка мозга">
  <meta property="og:description" content="Читайте быстрее. Понимайте глубже. По 10 минут в день.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#FFF5F7">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D4708F'%3E%3Cpath d='M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;600;700;800&subset=cyrillic&display=swap">
  <style>
:root{
  --bg:#FFF5F7; --powder:#FCE4EC; --surface:#FFFFFF; --line:#F0D3DC;
  --rose:#D4708F; --accent:#A8476A; --accent-hover:#8C3757; --on-accent:#FFFFFF;
  --fg:#3E2A2F; --muted:#7A6266; --gold:#C9A227; --gold-text:#7A5F0C;
  --ok:#2F7A4A; --err:#B3261E; --ok-bg:#E3F2E8; --err-bg:#FBE4E2;
  --shadow:0 2px 10px rgba(62,42,47,.08);
  --display:"Lora",Georgia,"Times New Roman",serif;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2A1E22; --powder:#3A2A30; --surface:#3A2A30; --line:#55404A;
  --rose:#E48AA6; --accent:#E48AA6; --accent-hover:#F0A6BD; --on-accent:#2A1E22;
  --fg:#F7E8EC; --muted:#C9AEB6; --gold:#C9A227; --gold-text:#C9A227;
  --ok:#8CC09D; --err:#F2938B; --ok-bg:#24392B; --err-bg:#4A2522;
  --shadow:0 2px 10px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2A1E22; --powder:#3A2A30; --surface:#3A2A30; --line:#55404A;
  --rose:#E48AA6; --accent:#E48AA6; --accent-hover:#F0A6BD; --on-accent:#2A1E22;
  --fg:#F7E8EC; --muted:#C9AEB6; --gold:#C9A227; --gold-text:#C9A227;
  --ok:#8CC09D; --err:#F2938B; --ok-bg:#24392B; --err-bg:#4A2522;
  --shadow:0 2px 10px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--accent)}
a:hover{color:var(--accent-hover)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0 0 .5em}
h1{font-size:clamp(30px,5vw,46px)}
h2{font-size:clamp(22px,3vw,30px)}
h3{font-size:20px}
p{margin:0 0 1em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.container{width:100%;max-width:1120px;margin:0 auto;padding:0 16px}
.narrow{max-width:760px}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:8px;background:var(--surface);padding:8px 12px;z-index:100}

/* Header */
.site-header{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.header-row{display:flex;align-items:center;gap:16px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:21px;font-weight:600;color:var(--fg);text-decoration:none}
.logo svg{color:var(--rose)}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav a{color:var(--fg);text-decoration:none;font-weight:600;font-size:15px;padding:8px 12px;border-radius:8px}
.nav a:hover,.nav a[aria-current="page"]{background:var(--powder);color:var(--accent)}
.icon-btn{background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;width:44px;height:44px;display:inline-grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.menu-btn{display:none}
@media (max-width:860px){
  .menu-btn{display:inline-grid;margin-left:auto}
  .nav{display:none;position:absolute;left:0;right:0;top:64px;background:var(--bg);flex-direction:column;align-items:stretch;padding:8px 16px 16px;border-bottom:1px solid var(--line);margin:0}
  .nav.open{display:flex}
  .nav a{padding:12px}
}

main{flex:1;padding:32px 0 64px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--powder);color:var(--accent-hover)}
.btn.small{min-height:36px;padding:6px 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* Cards and grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card.powder{background:var(--powder);box-shadow:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
a.card{text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-2px);border-color:var(--rose);color:var(--fg)}
.card .ico{color:var(--rose);width:40px;height:40px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--powder);color:var(--fg);border:1px solid var(--line)}
button.tag{cursor:pointer;font-family:inherit}
button.tag[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.meta{font-size:14px;color:var(--muted)}
.section{margin-top:56px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ribbon{height:14px;margin:48px auto;max-width:240px;background:linear-gradient(90deg,transparent,var(--rose) 20%,var(--rose) 80%,transparent);mask:radial-gradient(circle at 50% 50%,#000 3px,transparent 4px) center/14px 14px repeat-x,linear-gradient(#000,#000) center/100% 2px no-repeat;-webkit-mask:radial-gradient(circle at 50% 50%,#000 3px,transparent 4px) center/14px 14px repeat-x,linear-gradient(#000,#000) center/100% 2px no-repeat}

/* Hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;padding:24px 0}
.hero p.lead{font-size:19px;color:var(--muted);max-width:52ch}
.hero-art{color:var(--rose)}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero-art{max-width:300px;margin:0 auto;order:-1}}
.streak{display:inline-flex;gap:8px;align-items:center;font-weight:700;color:var(--gold-text);background:var(--powder);border-radius:99px;padding:6px 14px;margin-bottom:16px}
.steps{counter-reset:s}
.step{position:relative;padding-top:56px}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:16px;left:20px;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.step h3{margin-top:8px}

/* Article / prose */
.prose{font-family:var(--display);font-size:18px;line-height:1.7;max-width:68ch}
.prose h2{margin-top:1.6em;font-size:26px}
.prose h3{margin-top:1.3em}
.prose ul,.prose ol{padding-left:1.3em}
.prose li{margin-bottom:.4em}
.prose blockquote{margin:1.2em 0;padding:12px 20px;border-left:4px solid var(--rose);background:var(--powder);border-radius:0 12px 12px 0}
.toc{background:var(--powder);border-radius:16px;padding:16px 20px;margin:24px 0}
.toc ol{margin:8px 0 0;padding-left:20px}
.toc a{text-decoration:none}
.article-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:40px;align-items:start}
.article-layout .toc{position:sticky;top:88px;margin:0}
@media (max-width:900px){.article-layout{grid-template-columns:1fr}.article-layout .toc{position:static;order:-1}}
.cover{aspect-ratio:16/7;border-radius:16px;display:grid;place-items:center;color:var(--rose);background:var(--powder);margin-bottom:24px;overflow:hidden}
.cover svg{width:110px;height:110px}
.thumb{aspect-ratio:16/9;border-radius:12px;background:var(--powder);display:grid;place-items:center;color:var(--rose)}
.thumb svg{width:56px;height:56px}
.breadcrumbs{font-size:14px;color:var(--muted);margin-bottom:16px}
.breadcrumbs a{color:var(--muted)}

/* Course */
.progress{height:10px;background:var(--powder);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.lesson-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.lesson-item{display:flex;gap:16px;align-items:center;text-decoration:none;color:var(--fg)}
.lesson-num{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--powder);color:var(--accent);border:2px solid var(--line)}
.lesson-item.done .lesson-num{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.lesson-item.next{border-color:var(--accent);border-width:2px}
.badge-next{font-size:12px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:99px;padding:2px 10px;margin-left:auto;white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;flex-wrap:wrap}

/* Trainers (clean, no decor) */
.trainer{max-width:820px;margin:0 auto}
.trainer-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:16px 0}
.howto{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.howto summary{cursor:pointer;padding:12px 16px;font-weight:700}
.howto div{padding:0 16px 12px}
.options{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.field select,.field input[type=text],.field input[type=number],.field input[type=email],.field input[type=password],.field input[type=time]{font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.check{display:flex;gap:8px;align-items:center;font-size:15px;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.stage-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-height:200px;position:relative}
.hud{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;font-size:18px;font-weight:700;margin-bottom:16px;font-variant-numeric:tabular-nums}
.hud span{color:var(--muted);font-weight:600;font-size:14px;display:block;text-align:center}
.paused{position:absolute;inset:0;background:var(--surface);border-radius:16px;display:grid;place-items:center;font-size:22px;font-weight:700;z-index:2}

.schulte{display:grid;gap:6px;margin:0 auto;max-width:520px;position:relative}
.schulte button{aspect-ratio:1;min-width:44px;min-height:44px;font:inherit;font-weight:700;font-size:clamp(16px,4.5vw,28px);border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.schulte button:hover{border-color:var(--accent)}
.schulte button.found{opacity:.35}
.schulte button.red{color:var(--err);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.schulte button.black{color:var(--fg)}
.schulte button.flash{background:var(--err-bg);border-color:var(--err)}
.schulte .dot{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--accent);pointer-events:none}
.next-hint{text-align:center;font-size:20px;margin-bottom:12px}
.next-hint b{font-size:28px;color:var(--accent)}

.result{text-align:center;padding:12px}
.result .big{font-family:var(--display);font-size:48px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}
.result-grid div{background:var(--powder);border-radius:12px;padding:12px}
.result-grid b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.guest-note{font-size:14px;color:var(--muted);margin-top:16px}

.reading-text{font-family:var(--display);font-size:19px;line-height:1.75;max-width:66ch;margin:0 auto}
.quiz-q{margin-bottom:20px}
.quiz-q fieldset{border:none;padding:0;margin:0}
.quiz-q legend{font-weight:700;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;min-height:44px;background:var(--bg)}
.opt input{accent-color:var(--accent);width:18px;height:18px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--err);background:var(--err-bg)}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:520px;margin:0 auto}
.choice-grid .btn{width:100%}
.feedback{text-align:center;min-height:28px;font-weight:700;margin-top:12px}
.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--err)}

.rebus{font-family:var(--display);font-size:clamp(40px,10vw,72px);font-weight:600;text-align:center;letter-spacing:.04em;padding:24px 0;color:var(--fg)}
.flip{perspective:1000px;max-width:460px;margin:0 auto;cursor:pointer}
.flip-inner{position:relative;min-height:220px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;display:grid;place-items:center;text-align:center;padding:24px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:700}
.flip-face.back{transform:rotateY(180deg);background:var(--powder);font-weight:600;font-size:19px}
.pairs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pairs button{min-height:84px;font:inherit;font-size:14px;font-weight:600;border-radius:12px;border:1px solid var(--line);background:var(--accent);color:var(--on-accent);cursor:pointer;padding:6px}
.pairs button.open{background:var(--bg);color:var(--fg)}
.pairs button.matched{background:var(--ok-bg);color:var(--fg);border-color:var(--ok);cursor:default}
@media (max-width:560px){.pairs{grid-template-columns:repeat(3,minmax(0,1fr))}}

.stroop-word{font-size:clamp(44px,12vw,80px);font-weight:800;text-align:center;padding:24px 0;letter-spacing:.02em}
.dir-box{display:grid;place-items:center;padding:16px}
.dir-box svg{width:200px;height:120px}
.metronome-dot{width:24px;height:24px;border-radius:50%;background:var(--line);margin:0 auto;transition:background .05s}
.metronome-dot.on{background:var(--accent)}
.neuro-steps{font-size:18px}
.neuro-steps li{margin-bottom:6px}
.neuro-steps li.active{color:var(--accent);font-weight:700}

/* Cabinet */
.stat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat-tile b{display:block;font-family:var(--display);font-size:32px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat-tile span{color:var(--muted);font-size:14px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--ui)}
.chart .gridline{stroke:var(--line)}
.chart .line{stroke:var(--accent);stroke-width:2.5;fill:none}
.chart .pt{fill:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--muted);font-weight:700}
td{font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}
.ach{display:flex;gap:12px;align-items:center}
.ach-ico{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#3E2A2F}
.ach.locked{opacity:.55}
.ach.locked .ach-ico{background:var(--line);color:var(--muted)}
.ach small{color:var(--gold-text);font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tabs a{text-decoration:none;font-weight:700;padding:8px 16px;border-radius:99px;border:1px solid var(--line);color:var(--fg)}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.cookie{position:fixed;left:16px;right:16px;bottom:16px;max-width:560px;margin:0 auto;z-index:40}

/* Footer */
.site-footer{background:var(--powder);border-top:1px solid var(--line);padding:40px 0 24px;font-size:15px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:24px}
.footer-grid ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.footer-grid a{color:var(--fg);text-decoration:none}
.footer-grid a:hover{color:var(--accent);text-decoration:underline}
.footer-grid h4{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@media (max-width:760px){.footer-grid{grid-template-columns:1fr 1fr}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

Бабушка придумала правило: прочитал книгу — расскажи о ней за ужином. Сначала рассказывать было трудно. Я путал имена героев и забывал, с чего всё началось. Бабушка не ругала, а задавала вопросы. Кто главный герой? Чего он хотел? Что ему мешало? Чем всё закончилось? Через месяц я рассказывал так, что брат просил не выдавать концовку.

Зимой на чердаке было холодно, и папа принёс обогреватель. Бабушка поставила рядом старое кресло и плед. Иногда мы читали вдвоём: она — свою книгу, я — свою, и только страницы шуршали в тишине. Это было лучше любого кино.

Весной к нам пришли соседские дети. Они услышали, что у нас есть библиотека, и попросили что-нибудь почитать. Бабушка завела тетрадь, куда записывала, кто и какую книгу взял. Скоро на чердак стали подниматься по пять-шесть человек в неделю. Мама перестала вздыхать и даже купила ещё одну полку.

Прошло несколько лет. Бабушки больше нет с нами, но библиотека осталась. Тетрадь с записями лежит на верхней полке, рядом с книжкой стихов из парка. Я до сих пор поднимаюсь на чердак, когда хочу подумать. Сажусь в кресло, беру первую попавшуюся книгу и открываю её на случайной странице.

Иногда мне кажется, что бабушка оставила нам не книги, а привычку. Привычку замедляться, слушать и задавать вопросы. И каждый раз, когда соседский малыш робко стучит в дверь и спрашивает, можно ли почитать про пиратов, я понимаю, что её библиотека всё ещё работает.`,

Психологи различают несколько видов внимания. Непроизвольное внимание срабатывает само: резкий звук или яркая вспышка заставляют нас обернуться, даже если мы этого не хотели. Это древний механизм, который помогал нашим предкам замечать опасность. Произвольное внимание требует усилия: мы сами решаем сосредоточиться на скучном отчёте или трудной задаче. Именно оно быстро устаёт.

Важное свойство внимания — объём. Классические эксперименты показывают, что человек способен одновременно удерживать в фокусе ограниченное число объектов, обычно от четырёх до семи. Когда объектов больше, часть из них выпадает из сознания. Поэтому так трудно читать, одновременно слушая разговор: два потока информации борются за одни и те же ресурсы.

Ещё одно свойство — устойчивость. Даже опытный человек не может сосредоточенно работать несколько часов подряд без снижения качества. Исследования показывают, что внимание колеблется волнами: периоды высокой концентрации сменяются короткими провалами. Многие замечали, что во время чтения вдруг понимают: последние полстраницы глаза скользили по строкам, а мысли были где-то далеко.

Третье свойство — переключаемость. Каждый раз, когда мы переходим от одной задачи к другой, мозгу нужно время, чтобы перестроиться. Учёные называют это ценой переключения. Если человек каждые пять минут проверяет почту, общее время работы заметно увеличивается, а количество ошибок растёт. При этом сам человек часто уверен, что работает эффективно.

Что из этого следует для чтения? Во-первых, лучше читать короткими сессиями по двадцать–тридцать минут, а не пытаться осилить главу за один присест в любом состоянии. Во-вторых, нужно убрать источники непроизвольного внимания: телефон с уведомлениями, открытые вкладки, работающий телевизор. В-третьих, перед чтением полезно поставить цель. Когда мозг знает, что искать, он легче отсеивает лишнее.

Хорошая новость в том, что внимание поддаётся тренировке. Упражнения на поиск объектов, такие как таблицы Шульте, развивают скорость и объём внимания. Задания, где нужно подавить автоматическую реакцию, например тест Струпа, тренируют контроль. Регулярное чтение длинных текстов без отвлечений само по себе укрепляет устойчивость.

Не стоит ждать мгновенных результатов. Как и мышцы, внимание крепнет постепенно. Первые изменения обычно заметны через две-три недели ежедневной практики. Человек начинает замечать, что дольше удерживает мысль, реже теряет нить рассуждения и быстрее возвращается к работе после того, как его прервали. Эти небольшие изменения складываются в большой результат: чтение становится не только быстрее, но и приятнее.`,

  function lineChart(points, opts) {
    if (points.length < 2) return `<p class="muted">Нужно минимум два результата, чтобы построить график.</p>`;
    const W = 640, H = 240, L = 48, R = 16, T = 16, B = 32;
    const ys = points.map(p => p.y); let min = Math.min(...ys), max = Math.max(...ys);
    if (min === max) { min -= 1; max += 1; }
    const pad = (max - min) * 0.1; min = Math.max(0, min - pad); max += pad;
    const x = i => L + i * (W - L - R) / (points.length - 1);
    const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
    const ticks = [0, 1, 2, 3].map(i => min + (max - min) * i / 3);
    const d = points.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.y).toFixed(1)).join(" ");
    const step = Math.ceil(points.length / 6);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">
      ${ticks.map(t => `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${Math.round(t * 10) / 10}</text>`).join("")}
      <path class="line" d="${d}"/>
      ${points.map((p, i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.y)}" r="4"><title>${esc(p.label)}: ${p.y} ${opts.unit}</title></circle>`).join("")}
      ${points.map((p, i) => i % step === 0 || i === points.length - 1 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(p.short)}</text>` : "").join("")}
    </svg>`;
  }

    switch (r.type) {

    const list = state.results.filter(r => (!type || r.type === type) && r.day >= since).slice().reverse();
    const sizes = [3, 4, 5, 6, 7].filter(n => KG.resultsOf("shulte", { size: n }).length >= 2);
    const shSize = +(q.get("size") || sizes[0] || 5);

    const math = state.results.filter(r => r.type === "logika" && r.params.mode === "math");
    const short = r => new Date(r.date).toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
    return { title: "Статистика", html: `
      <h1>Статистика и история</h1>${cabTabs("/progress")}
      <div class="grid g2">
        <div class="card"><h3>Таблица Шульте, время (с)</h3>

          ${lineChart(sh.map(r => ({ y: Math.round(r.value * 10) / 10, label: fmtDate(r.date), short: short(r) })), { label: "Время в таблице Шульте " + shSize + "×" + shSize, unit: "с" })}</div>
        <div class="card"><h3>Устный счёт, верных за минуту</h3>
          ${lineChart(math.map(r => ({ y: r.value, label: fmtDate(r.date), short: short(r) })), { label: "Результаты устного счёта", unit: "отв." })}</div>
      </div>
      <div class="card" style="margin-top:16px">
        <h3>История тренировок</h3>
        <form class="options" id="hist-f" style="border:none;padding:0;background:none">
          <label class="field">Тренажёр<select name="type"><option value="">Все</option>${KG.TRAINERS.map(t => `<option value="${t.slug}" ${t.slug === type ? "selected" : ""}>${t.title}</option>`).join("")}</select></label>
          <label class="field">Период<select name="period"><option value="7" ${period === "7" ? "selected" : ""}>7 дней</option><option value="30" ${period === "30" ? "selected" : ""}>30 дней</option><option value="all" ${period === "all" ? "selected" : ""}>Всё время</option></select></label>
        </form>
        ${list.length ? `<div class="table-wrap"><table><thead><tr><th>Дата</th><th>Тренажёр</th><th>Параметры</th><th>Результат</th><th>Ошибки</th></tr></thead><tbody>
          ${list.slice(0, 100).map(r => { const [p, v, e] = describe(r); return `<tr><td>${new Date(r.date).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</td><td>${TYPE_NAMES[r.type]}</td><td>${esc(p)}</td><td>${esc(v)}${r.valid ? "" : ' <span class="meta">(недостоверно)</span>'}</td><td>${e}</td></tr>`; }).join("")}
        </tbody></table></div>` : `<p class="muted">Пока нет тренировок за этот период. <a href="#/trenazhery">Начать</a></p>`}

      mount(app) {

  KG.route(/^\/kabinet\/dostizheniya$/, () => ({ title: "Достижения", html: `
    <h1>Достижения</h1>${cabTabs("/dostizheniya")}
    <p class="muted">Получено ${state.achievements.length} из ${KG.ACHIEVEMENTS.length}</p>
    <div class="grid g2">${KG.ACHIEVEMENTS.map(a => { const got = state.achievements.includes(a.id); return `<div class="card ach${got ? "" : " locked"}"><div class="ach-ico">${icon(got ? "award" : "lock", 26)}</div><div><b>${a.title}</b><br><span class="muted">${a.desc}</span>${got ? "<br><small>Получено</small>" : ""}</div></div>`; }).join("")}</div>` }));

  KG.route(/^\/kabinet\/nastroiki$/, () => ({ title: "Настройки", html: `
    <h1>Настройки</h1>${cabTabs("/nastroiki")}
    <div class="grid g2">
      <form class="card" id="prof-f"><h3>Профиль</h3>
        <label class="field" style="margin-bottom:12px">Имя<input type="text" name="name" value="${esc(state.profile.name)}" maxlength="40" autocomplete="given-name"></label>
        <label class="field" style="margin-bottom:12px">Цель, слов/мин<input type="number" name="goal" value="${state.profile.goal}" min="100" max="1500" step="10"></label>
        <label class="field" style="margin-bottom:16px">Тема<select name="theme"><option value="system" ${state.theme === "system" ? "selected" : ""}>Как в системе</option><option value="light" ${state.theme === "light" ? "selected" : ""}>Светлая</option><option value="dark" ${state.theme === "dark" ? "selected" : ""}>Тёмная</option></select></label>
        <button class="btn">Сохранить</button></form>
      <div class="card"><h3>Мои данные</h3>
        <p class="muted">Скачайте все результаты в JSON или удалите их из этого браузера.</p>
        <div class="btn-row"><button class="btn ghost" id="export">Выгрузить данные (JSON)</button><button class="btn ghost" id="wipe">Удалить все данные</button></div>
        <p class="meta" style="margin-top:16px">Согласие на cookies: ${state.cookie === "all" ? "все" : state.cookie === "necessary" ? "только необходимые" : "не выбрано"}. <button class="btn small ghost" id="cookie-reset" style="margin-left:8px">Изменить</button></p>
      </div>
    </div>`,
    mount(app) {
      app.querySelector("#prof-f").onsubmit = e => {
        e.preventDefault(); const f = new FormData(e.target);
        state.profile.name = String(f.get("name")).trim();
        state.profile.goal = Math.min(1500, Math.max(100, +f.get("goal") || 400));
        state.theme = f.get("theme"); save(); applyTheme(); toast("Сохранено");
      };
      app.querySelector("#export").onclick = () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "knizhnaya-gostinaya-data.json"; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      };
      app.querySelector("#wipe").onclick = () => { if (confirm("Удалить все результаты, прогресс курса и настройки из этого браузера? Действие необратимо.")) { KG.resetAll(); toast("Данные удалены"); go(); } };
      app.querySelector("#cookie-reset").onclick = () => { state.cookie = null; save(); cookieBanner(); };
    } }));

  /* Вход / регистрация — заглушка до серверного этапа (MVP-2) */
  const authStub = title => () => ({ title, html: `<div class="narrow" style="margin:0 auto;max-width:520px">
    <h1>${title}</h1>
    <div class="card">
      <p>Регистрация и вход по email, через Яндекс ID и Google появятся на этапе MVP-2 вместе с сервером: тогда результаты будут синхронизироваться между устройствами.</p>
      <p class="muted">Сейчас все тренажёры и курс доступны без регистрации, а прогресс сохраняется в этом браузере. При регистрации его можно будет перенести в аккаунт.</p>
      <div class="btn-row"><a class="btn" href="#/kabinet">Открыть кабинет гостя</a><a class="btn ghost" href="#/trenazhery">К тренажёрам</a></div>
    </div></div>` });
  KG.route(/^\/vhod$/, authStub("Вход"));
  KG.route(/^\/registratsiya$/, authStub("Регистрация"));
  KG.route(/^\/vosstanovlenie$/, authStub("Восстановление пароля"));

  KG.route(/^\/o-proekte$/, () => ({ title: "О проекте", html: `<div class="narrow" style="margin:0 auto">
    <div class="breadcrumbs"><a href="#/">Главная</a> / О проекте</div><h1>О проекте</h1>
    <article class="prose"><p>«Книжная гостиная» — сайт для взрослых, которые хотят читать быстрее, лучше запоминать прочитанное и держать мозг в тонусе.</p>
    <p>Мы объединили пошаговый курс скорочтения, короткие тренажёры и статистику прогресса. Тренировки занимают 5–15 минут: их легко встроить в обеденный перерыв или вечер с книгой.</p>
    <h2>Что внутри</h2><ul><li>Курс из 10 уроков с практическими заданиями.</li><li>7 тренажёров: Шульте, тест скорости, ребусы, карточки, логика, нейрогимнастика, Струп-тест.</li><li>Серия дней, достижения и графики прогресса.</li></ul>
    <p>Все тексты на сайте написаны для проекта.</p></article></div>` }));

  KG.route(/^\/politika$/, () => ({ title: "Политика конфиденциальности", html: `<div class="narrow" style="margin:0 auto"><h1>Политика конфиденциальности</h1>
    <article class="prose"><p><i>Черновик. Итоговый текст утверждает юрист после выбора целевого рынка (PRD, раздел 8).</i></p>
    <h2>Какие данные мы храним</h2><p>В текущей версии сайт не передаёт ваши данные на сервер. Результаты тренировок, прогресс курса и настройки хранятся в локальном хранилище вашего браузера.</p>
    <h2>Аналитика</h2><p>Счётчики аналитики запускаются только после того, как вы нажали «Принять все» в баннере cookies.</p>
    <h2>Как удалить данные</h2><p>Откройте Кабинет → Настройки → «Удалить все данные» или очистите данные сайта в браузере.</p></article></div>` }));

  KG.route(/^\/soglasie$/, () => ({ title: "Согласие на обработку персональных данных", html: `<div class="narrow" style="margin:0 auto"><h1>Согласие на обработку персональных данных</h1>
    <article class="prose"><p><i>Черновик. Текст согласия будет утверждён юристом и показан отдельной галочкой при регистрации.</i></p>
    <p>Регистрируясь на сайте, пользователь даёт согласие на обработку email, имени, часового пояса и результатов тренировок в целях предоставления сервиса, отправки писем о подтверждении и напоминаний.</p></article></div>` }));

  function notFound() {
    return { title: "Страница не найдена", html: `<div style="text-align:center;padding:48px 0">
      <div style="color:var(--rose)">${icon("book", 96)}</div>
      <h1>Страница не найдена</h1><p class="muted">Похоже, эту страницу вырвали из книги. Попробуйте начать с главной.</p>
      <a class="btn" href="#/">На главную</a></div>` };
  }

  /* ---------- Запуск ---------- */
  document.addEventListener("DOMContentLoaded", () => {
    layout();
    window.addEventListener("hashchange", go);
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
    go();
  });
})();

</script>
  <script>
/* Тренажёры (PRD 6.5). Общий каркас + 7 реализаций. */
(function () {
  const KG = window.KG, esc = KG.esc, fmt = KG.fmt, icon = KG.icon;

  function Timer() {
    let acc = 0, t0 = null;
    return {
      start() { acc = 0; t0 = performance.now(); },
      pause() { if (t0 != null) { acc += performance.now() - t0; t0 = null; } },
      resume() { if (t0 == null) t0 = performance.now(); },
      sec() { return (acc + (t0 != null ? performance.now() - t0 : 0)) / 1000; }
    };
  }

  function shell(slug, howto, optionsHtml, extra) {
    const t = KG.TRAINERS.find(x => x.slug === slug);
    const seen = KG.state().howtoSeen[slug];
    return `<div class="trainer">
      <div class="breadcrumbs"><a href="#/">Главная</a> / <a href="#/trenazhery">Тренажёры</a> / ${t.title}</div>
      <h1>${t.title}</h1>
      <details class="howto" ${seen ? "" : "open"}><summary>Как заниматься</summary><div>${howto}</div></details>
      ${optionsHtml ? `<form class="options" id="opts" onsubmit="return false">${optionsHtml}</form>` : ""}
      <div class="trainer-bar">
        <div class="btn-row">
          <button class="btn" id="b-start">Старт</button>
          ${extra && extra.noPause ? "" : `<button class="btn ghost" id="b-pause" disabled>Пауза</button>`}
          <button class="btn ghost" id="b-restart" disabled>Заново</button>
        </div>
      </div>
      <div class="stage-box" id="stage"><p class="muted" style="text-align:center;margin-top:60px">Выберите настройки и нажмите «Старт».</p></div>
      <div class="sr-only" aria-live="polite" id="live"></div>
    </div>`;
  }

  /* Общий контроллер: Старт / Пауза / Заново, экран результата. */
  function control(app, slug, impl) {
    const startB = app.querySelector("#b-start"), pauseB = app.querySelector("#b-pause"), restartB = app.querySelector("#b-restart");
    const stage = app.querySelector("#stage"), live = app.querySelector("#live"), opts = app.querySelector("#opts");
    let status = "idle", overlay = null, snap = {};
    const setOpts = dis => opts && opts.querySelectorAll("input,select").forEach(i => { i.disabled = dis || i.dataset.locked === "1"; });
    const ctx = {
      stage, live, status: () => status,
      say(msg) { live.textContent = ""; setTimeout(() => live.textContent = msg, 30); },
      opts() { return snap; },
      check(name) { const el = opts && opts.querySelector(`[name="${name}"]`); return !!(el && el.checked); },
      finish(res) {
        status = "done"; impl.stop && impl.stop();
        if (pauseB) pauseB.disabled = true;
        startB.textContent = "Старт"; setOpts(false);
        const st = KG.state(); st.howtoSeen[slug] = true; KG.save();
        if (res.save) KG.addResult(res.save);
        const idx = KG.TRAINERS.findIndex(t => t.slug === slug), next = KG.TRAINERS[(idx + 1) % KG.TRAINERS.length];
        stage.innerHTML = `<div class="result">
          <p class="muted" style="margin:0">${res.label}</p>
          <div class="big">${res.big}</div>
          ${res.grid ? `<div class="result-grid">${res.grid.map(([l, v]) => `<div><span class="meta">${l}</span><b>${v}</b></div>`).join("")}</div>` : ""}
          ${res.note ? `<p>${res.note}</p>` : ""}
          ${res.html || ""}
          <div class="btn-row" style="justify-content:center"><button class="btn" id="r-again">Ещё раз</button><a class="btn ghost" href="#/trenazhery/${next.slug}">Следующий: ${next.title}</a></div>
          <p class="guest-note">Результат сохранён в этом браузере и виден в <a href="#/kabinet">кабинете</a>.</p></div>`;
        ctx.say(res.label + ": " + res.big);
        stage.querySelector("#r-again").onclick = () => startB.click();
        restartB.disabled = true;
      }
    };
    startB.onclick = () => {
      if (status === "running" || status === "paused") return;
      if (overlay) { overlay.remove(); overlay = null; }
      snap = opts ? Object.fromEntries(new FormData(opts).entries()) : {};
      status = "running"; setOpts(true);
      if (pauseB) { pauseB.disabled = false; pauseB.textContent = "Пауза"; }
      restartB.disabled = false;
      KG.track("training_start", { trainer: slug, params: ctx.opts() });
      impl.start(ctx);
    };
    if (pauseB) pauseB.onclick = () => {
      if (status === "running") {
        status = "paused"; impl.pause && impl.pause();
        overlay = document.createElement("div"); overlay.className = "paused"; overlay.textContent = "Пауза";
        stage.appendChild(overlay); pauseB.textContent = "Продолжить"; ctx.say("Пауза");
      } else if (status === "paused") {
        status = "running"; overlay && overlay.remove(); overlay = null;
        impl.resume && impl.resume(); pauseB.textContent = "Пауза";
      }
    };
    restartB.onclick = () => {
      impl.stop && impl.stop();
      if (overlay) { overlay.remove(); overlay = null; }
      status = "idle"; setOpts(false); startB.click();
    };
    KG.cleanup = () => { impl.stop && impl.stop(); };
    return ctx;
  }

  function compare(cur, prev, best, lowerBetter, unit, digits) {
    const f = v => (digits ? fmt(v, digits) : Math.round(v)) + " " + unit;
    const rows = [];
    rows.push(["Прошлый результат", prev ? f(prev.value) : "—"]);
    rows.push(["Лучший результат", best ? f(best.value) : "—"]);
    let note = "";
    if (!best) note = "Это ваш первый результат в этом режиме.";
    else if (lowerBetter ? cur < best.value : cur > best.value) note = "🎉 Новый рекорд!";
    return { rows, note };
  }

  /* ================= Таблица Шульте ================= */
  const ABC = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
  KG.route(/^\/trenazhery\/shulte$/, () => ({
    title: "Таблица Шульте",
    html: shell("shulte",
      `<p>Находите элементы по порядку, нажимая на клетки. Смотрите в центр таблицы и ищите боковым зрением — так расширяется поле зрения.</p>
       <p><b>Шульте–Горбова:</b> чередуйте чёрные числа по возрастанию и красные (подчёркнутые) по убыванию: чёрное 1, красное максимальное, чёрное 2…</p>`,
      `<label class="field">Размер<select name="size">${[3, 4, 5, 6, 7].map(n => `<option value="${n}" ${n === 5 ? "selected" : ""}>${n}×${n}</option>`).join("")}</select></label>
       <label class="field">Режим<select name="mode"><option value="asc">Числа по порядку</option><option value="desc">Обратный отсчёт</option><option value="letters">Буквы (до 5×5)</option><option value="gorbov">Шульте–Горбова</option></select></label>
       <label class="check"><input type="checkbox" name="shuffle"> Перемешивать после нажатия</label>
       <label class="check"><input type="checkbox" name="highlight" checked> Подсвечивать найденные</label>
       <label class="check"><input type="checkbox" name="dot"> Точка фиксации</label>`),
    mount(app) {
      const opts = app.querySelector("#opts");
      const sync = () => {
        const letters = opts.mode.value === "letters";
        [...opts.size.options].forEach(o => { o.disabled = letters && +o.value > 5; });
        if (letters && +opts.size.value > 5) opts.size.value = "5";
      };
      opts.mode.addEventListener("change", sync);

      let timer, raf, cells, seq, pos, errors, N, mode, o;
      const impl = {
        start(ctx) {
          o = ctx.opts(); N = +o.size; mode = o.mode;
          const total = N * N;
          if (mode === "gorbov") {
            const B = Math.ceil(total / 2), R = Math.floor(total / 2);
            cells = [];
            for (let i = 1; i <= B; i++) cells.push({ label: String(i), kind: "black", v: i });
            for (let i = 1; i <= R; i++) cells.push({ label: String(i), kind: "red", v: i });
            const blacks = cells.filter(c => c.kind === "black"), reds = cells.filter(c => c.kind === "red").sort((a, b) => b.v - a.v);
            seq = [];
            for (let i = 0; i < B; i++) { seq.push(blacks[i]); if (reds[i]) seq.push(reds[i]); }
          } else {
            cells = [];
            for (let i = 0; i < total; i++) cells.push({ label: mode === "letters" ? ABC[i] : String(i + 1), kind: "", v: i });
            seq = mode === "desc" ? cells.slice().reverse() : cells.slice();
          }
          cells = KG.shuffle(cells); pos = 0; errors = 0;
          ctx.stage.innerHTML = `<div class="hud"><div><span>Время</span><b id="h-time">0,0</b></div><div><span>Ошибки</span><b id="h-err">0</b></div></div>
            <div class="next-hint" id="h-next"></div>
            <div class="schulte" id="grid" style="grid-template-columns:repeat(${N},1fr)"></div>`;
          this.ctx = ctx;
          draw(); hint();
          timer = Timer(); timer.start();
          const tick = () => { const el = document.getElementById("h-time"); if (el) el.textContent = fmt(timer.sec()); raf = requestAnimationFrame(tick); };
          raf = requestAnimationFrame(tick);
        },
        pause() { timer.pause(); },
        resume() { timer.resume(); },
        stop() { cancelAnimationFrame(raf); }
      };
      const ctx = control(app, "shulte", impl);

      function label(c) { return mode === "gorbov" ? (c.kind === "red" ? "красное " : "чёрное ") + c.label : c.label; }
      function hint() {
        const h = document.getElementById("h-next"), c = seq[pos];
        if (h && c) h.innerHTML = `Найдите: <b class="${c.kind === "red" ? "" : ""}" style="${c.kind === "red" ? "color:var(--err);text-decoration:underline" : ""}">${esc(c.label)}</b>${mode === "gorbov" ? ` <span class="meta">(${c.kind === "red" ? "красное" : "чёрное"})</span>` : ""}`;
      }
      function draw() {
        const g = document.getElementById("grid");
        g.innerHTML = cells.map((c, i) => {
          const found = seq.indexOf(c) < pos;
          return `<button data-i="${i}" class="${c.kind} ${found && o.highlight ? "found" : ""}" aria-label="${esc(label(c))}${found ? ", найдено" : ""}">${esc(c.label)}</button>`;
        }).join("") + (o.dot ? `<span class="dot" aria-hidden="true"></span>` : "");
        g.onclick = e => {
          const b = e.target.closest("button"); if (!b || ctx.status() !== "running") return;
          const c = cells[+b.dataset.i];
          if (c === seq[pos]) {
            pos++;
            if (pos === seq.length) return done();
            if (o.shuffle) { cells = KG.shuffle(cells); draw(); g.querySelector("button")?.focus(); }
            else if (o.highlight) { b.classList.add("found"); }
            hint();
          } else if (seq.indexOf(c) >= pos) {
            errors++; document.getElementById("h-err").textContent = errors;

      `<label class="field">Колода<select name="deck">${KG.DECKS.map(d => `<option value="${d.id}">${d.title}</option>`).join("")}</select></label>
       <label class="field">Режим<select name="mode"><option value="study">Изучение</option><option value="quiz">Проверка</option><option value="pairs">Запомни пары</option></select></label>
       <label class="field">Пар (для игры)<select name="pairs"><option>6</option><option>8</option><option>10</option></select></label>`),
    mount(app) {
      const st = KG.state();

      const setBox = (deck, i, ok) => { st.leitner[deck + ":" + i] = ok ? Math.min(5, box(deck, i) + 1) : 1; KG.save(); };
      function pickLeitner(deck, n) {
        const idx = deck.cards.map((_, i) => i);

      function gen(level) {
        if (level === "лёгкий") { const a = R(1, 15), b = R(1, 15); if (Math.random() < .5 && a + b <= 20) return [`${a} + ${b}`, a + b]; const x = Math.max(a, b), y = Math.min(a, b); return [`${x} − ${y}`, x - y]; }
        if (level === "средний") { const t = R(0, 2); if (t === 0) { const a = R(10, 60), b = R(5, 40); return [`${a} + ${b}`, a + b]; } if (t === 1) { const a = R(30, 100), b = R(5, 30); return [`${a} − ${b}`, a - b]; } const a = R(2, 10), b = R(2, 10); return [`${a} × ${b}`, a * b]; }
        if (Math.random() < .5) { const a = R(11, 30), b = R(11, 20); return [`${a} × ${b}`, a * b]; }
        const b = R(3, 15), q = R(11, 40); return [`${b * q} : ${b}`, q];
      }
      function math(ctx, level) {
        let cur = gen(level), left = 60;
        ctx.stage.innerHTML = `<div class="hud"><div><span>Осталось</span><b id="m-left">60</b></div><div><span>Верно</span><b id="m-ok">0</b></div><div><span>Ошибки</span><b id="m-err">0</b></div></div>
          <p id="m-q" style="font-size:44px;font-weight:800;text-align:center;margin:12px 0;font-variant-numeric:tabular-nums">${cur[0]} = ?</p>
          <form id="m-f" style="display:flex;justify-content:center;gap:10px"><label class="sr-only" for="m-ans">Ответ</label>
            <input id="m-ans" inputmode="numeric" autocomplete="off" style="font:inherit;font-size:28px;width:160px;text-align:center;min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)">
            <button class="btn">OK</button></form><div class="feedback" id="m-fb"></div>`;
        const ans = ctx.stage.querySelector("#m-ans"); ans.focus();
        ctx.stage.querySelector("#m-f").onsubmit = e => {
          e.preventDefault(); if (paused || ans.value.trim() === "") return;
          const ok = +ans.value === cur[1], fb = ctx.stage.querySelector("#m-fb");
          ok ? right++ : wrong++;
          fb.className = "feedback " + (ok ? "ok" : "bad"); fb.textContent = ok ? "✓" : `✗ ${cur[0]} = ${cur[1]}`;
          ctx.stage.querySelector("#m-ok").textContent = right; ctx.stage.querySelector("#m-err").textContent = wrong;
          cur = gen(level); ctx.stage.querySelector("#m-q").textContent = cur[0] + " = ?"; ans.value = ""; ans.focus();
        };
        iv = setInterval(() => {
          left = Math.max(0, 60 - Math.floor(timer.sec()));
          const el = document.getElementById("m-left"); if (el) el.textContent = left;
          if (left <= 0) {
            clearInterval(iv);
            const params = { mode: "math", level };
            const prevList = KG.resultsOf("logika", params), prev = prevList[prevList.length - 1], best = KG.best("logika", params, false);
            const cmp = compare(right, prev, best, false, "отв.");
            ctx.finish({ label: "Устный счёт: верных ответов за минуту", big: String(right), grid: [["Ошибки", wrong], ...cmp.rows], note: cmp.note,
              save: { type: "logika", params, value: right, unit: "отв./мин", errors: wrong } });
          }
        }, 200);
      }
    }
  }));

  /* ================= Нейрогимнастика ================= */
  KG.route(/^\/trenazhery\/neiro$/, () => ({
    title: "Нейрогимнастика",
    html: shell("neiro",
      `<p>Выберите готовый комплекс или одно упражнение. Выполняйте шаги в ритме метронома: каждый удар — следующий шаг. Между упражнениями — пауза 5 секунд.</p>
       <p>Если упражнение даётся легко, увеличьте темп.</p>`,
      `<label class="field">Программа<select name="set">${KG.NEURO_SETS.map(s => `<option value="set:${s.id}">Комплекс «${s.title}» (${s.minutes} мин)</option>`).join("")}${KG.NEURO.map(e => `<option value="ex:${e.id}">Упражнение: ${e.title} (1 мин)</option>`).join("")}</select></label>
       <label class="field">Темп: <span id="bpm-v">60</span> уд/мин<input type="range" name="bpm" min="40" max="120" step="5" value="60" style="min-height:44px;accent-color:var(--accent)"></label>
       <label class="check"><input type="checkbox" name="sound" checked> Звук метронома</label>`),
    mount(app) {
      const opts = app.querySelector("#opts");
      opts.bpm.addEventListener("input", () => { app.querySelector("#bpm-v").textContent = opts.bpm.value; });
      opts.bpm.dataset.locked = "0";
      let ac, beatIv, secIv, timer, plan, idx, phaseLeft, phase, step, title;
      function click(strong) {
        if (!opts.sound.checked || !ac) return;
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = strong ? 1000 : 800; g.gain.setValueAtTime(.25, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .06);
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + .07);
      }
      const impl = {
        start(ctx) {
          const o = ctx.opts();
          try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) { ac = null; }
          const [kind, id] = o.set.split(":");
          if (kind === "set") { const s = KG.NEURO_SETS.find(x => x.id === id); title = s.title; plan = s.items.map(i => KG.NEURO.find(e => e.id === i)); var per = Math.round(s.minutes * 60 / plan.length); }
          else { const e = KG.NEURO.find(x => x.id === id); title = e.title; plan = [e]; per = 60; }
          this.per = per; idx = 0; timer = Timer(); timer.start();
          runEx(ctx);
          // Темп и звук остаются доступны во время занятия
          opts.bpm.disabled = false; opts.sound.disabled = false;
        },
        pause() { timer.pause(); clearInterval(beatIv); clearInterval(secIv); },
        resume() { timer.resume(); this.loop(this.ctx); },
        stop() { clearInterval(beatIv); clearInterval(secIv); },
        loop(ctx) {
          this.ctx = ctx;
          clearInterval(beatIv); clearInterval(secIv);
          let lastBpm = +opts.bpm.value;
          const beat = () => {
            if (phase !== "ex") return;
            step = (step + 1) % plan[idx].steps.length;
            click(step === 0);
            ctx.stage.querySelectorAll(".neuro-steps li").forEach((li, i) => li.classList.toggle("active", i === step));
            const d = ctx.stage.querySelector(".metronome-dot"); if (d) { d.classList.add("on"); setTimeout(() => d.classList.remove("on"), 120); }
          };
          const startBeat = () => { clearInterval(beatIv); beatIv = setInterval(() => { if (+opts.bpm.value !== lastBpm) { lastBpm = +opts.bpm.value; startBeat(); } beat(); }, 60000 / lastBpm); };
          startBeat();
          secIv = setInterval(() => {
            phaseLeft--;
            const el = ctx.stage.querySelector("#n-left"); if (el) el.textContent = phaseLeft;
            if (phaseLeft <= 0) {
              if (phase === "ex") {
                if (idx + 1 < plan.length) { phase = "rest"; phaseLeft = 5; showRest(ctx); }
                else { this.stop(); finish(ctx); }
              } else { idx++; runEx(ctx); }
            }
          }, 1000);
        }
      };
      const ctx = control(app, "neiro", impl);
      function runEx(ctx) {
        const e = plan[idx]; phase = "ex"; phaseLeft = impl.per; step = -1;
        ctx.stage.innerHTML = `<div class="hud"><div><span>Упражнение</span><b>${idx + 1} / ${plan.length}</b></div><div><span>Осталось, с</span><b id="n-left">${phaseLeft}</b></div></div>
          <h2 style="text-align:center">${esc(e.title)}</h2><div class="metronome-dot" aria-hidden="true"></div>
          <ol class="neuro-steps" style="max-width:520px;margin:16px auto">${e.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>`;
        ctx.say("Упражнение: " + e.title);
        impl.loop(ctx);
      }
      function showRest(ctx) {
        const nx = plan[idx + 1];
        ctx.stage.innerHTML = `<div style="text-align:center;padding:40px 0"><p class="muted">Пауза</p><div class="result"><div class="big" id="n-left">5</div></div><p>Далее: <b>${esc(nx.title)}</b></p></div>`;
        ctx.say("Пауза 5 секунд. Далее: " + nx.title);
      }
      function finish(ctx) {
        const sec = Math.round(timer.sec());
        ctx.finish({ label: "Комплекс выполнен", big: esc(title), grid: [["Упражнений", plan.length], ["Время", Math.floor(sec / 60) + " мин " + (sec % 60) + " с"]], note: "Отличная разминка! Теперь самое время почитать.",
          save: { type: "neiro", params: { set: title }, value: sec, unit: "с" } });
      }
    }
  }));

  /* ================= Струп-тест ================= */
  const COLORS = [["красный", "#C62828"], ["синий", "#1565C0"], ["зелёный", "#2E7D32"], ["фиолетовый", "#6A1B9A"]];
  const DIRS = [["влево", "←", 180], ["вправо", "→", 0], ["вверх", "↑", -90], ["вниз", "↓", 90]];
  KG.route(/^\/trenazhery\/strup$/, () => ({
    title: "Струп-тест",
    html: shell("strup",
      `<p><b>Цвета:</b> на экране появляется название цвета, напечатанное другим цветом. Выберите <b>цвет шрифта</b>, а не слово. 30 слов за попытку.</p>
       <p><b>Направление</b> (для людей с нарушением цветовосприятия): внутри стрелки написано направление. Выберите, куда <b>указывает стрелка</b>, а не слово.</p>
       <p class="meta">Клавиши 1–4 соответствуют кнопкам.</p>`,
      `<label class="field">Режим<select name="mode"><option value="color">Цвета</option><option value="dir">Направление</option></select></label>`),
    mount(app) {
      let timer, raf, items, k, errors, mode, keyH;
      const impl = {
        start(ctx) {
          mode = ctx.opts().mode; k = 0; errors = 0;
          const src = mode === "dir" ? DIRS : COLORS;
          items = Array.from({ length: 30 }, () => { const w = Math.floor(Math.random() * 4); let c; do c = Math.floor(Math.random() * 4); while (c === w); return [w, c]; });
          ctx.stage.innerHTML = `<div class="hud"><div><span>Слово</span><b id="s-k">1 / 30</b></div><div><span>Время</span><b id="s-t">0,0</b></div><div><span>Ошибки</span><b id="s-e">0</b></div></div>
            <div id="s-show" style="background:#fff;border-radius:12px;border:1px solid var(--line)"></div>
            <div class="choice-grid" style="margin-top:16px">${src.map((c, i) => `<button class="btn ghost" data-i="${i}"><span aria-hidden="true">${i + 1}.</span> ${mode === "dir" ? c[1] + " " + c[0] : `<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${c[1]}"></span> ${c[0]}`}</button>`).join("")}</div>
            <div class="feedback" id="s-fb"></div>`;
          draw(ctx);
          ctx.stage.querySelector(".choice-grid").onclick = e => { const b = e.target.closest("button"); if (b) answer(ctx, +b.dataset.i); };
          keyH = e => { if (ctx.status() === "running" && /^[1-4]$/.test(e.key)) answer(ctx, +e.key - 1); };
          document.addEventListener("keydown", keyH);
          timer = Timer(); timer.start();
          const tick = () => { const el = document.getElementById("s-t"); if (el) el.textContent = fmt(timer.sec()); raf = requestAnimationFrame(tick); };
          raf = requestAnimationFrame(tick);
        },
        pause() { timer.pause(); }, resume() { timer.resume(); },
        stop() { cancelAnimationFrame(raf); document.removeEventListener("keydown", keyH); }
      };
      const ctx = control(app, "strup", impl);
      function draw(ctx) {
        const [w, c] = items[k], box = ctx.stage.querySelector("#s-show");
        if (mode === "dir") {
          box.innerHTML = `<div class="dir-box"><svg viewBox="0 0 200 120" role="img" aria-label="Стрелка со словом ${DIRS[w][0]}"><g transform="rotate(${DIRS[c][2]} 100 60)"><path d="M20 40h110V15l55 45-55 45V80H20z" fill="#FCE4EC" stroke="#3E2A2F" stroke-width="3"/></g><text x="100" y="68" text-anchor="middle" font-size="24" font-weight="800" fill="#3E2A2F" font-family="Manrope,sans-serif">${DIRS[w][0]}</text></svg></div>`;
        } else box.innerHTML = `<div class="stroop-word" style="color:${COLORS[c][1]}" aria-label="Слово ${COLORS[w][0]}, цвет ${COLORS[c][0]}">${COLORS[w][0].toUpperCase()}</div>`;
      }
      function answer(ctx, i) {
        if (ctx.status() !== "running") return;
        const fb = ctx.stage.querySelector("#s-fb");
        if (i !== items[k][1]) { errors++; ctx.stage.querySelector("#s-e").textContent = errors; fb.className = "feedback bad"; fb.textContent = "✗ Ошибка"; }
        else { fb.className = "feedback ok"; fb.textContent = "✓"; }
        if (++k >= items.length) {
          const t = timer.sec(), params = { mode: mode === "dir" ? "dir" : "color" };
          const prevList = KG.resultsOf("strup", params), prev = prevList[prevList.length - 1], best = KG.best("strup", params, true);
          const cmp = compare(t, prev, best, true, "с", 1);
          return ctx.finish({ label: "Струп-тест пройден", big: fmt(t) + " с", grid: [["Ошибки", errors], ...cmp.rows], note: cmp.note,
            save: { type: "strup", params, value: Math.round(t * 10) / 10, unit: "с", errors } });
        }
        ctx.stage.querySelector("#s-k").textContent = (k + 1) + " / 30";
        draw(ctx);
      }
    }
  }));
})();

</script>
</body>
</html>
